name: Deploy to EC2 Nginx

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    permissions:
      contents: read
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to Nginx folder
        run: |
          sudo rm -rf /var/www/html/*
          sudo cp -r ./* /var/www/html/
          sudo chown -R www-data:www-data /var/www/html

      - name: Restart Nginx
        run: sudo systemctl restart nginx
